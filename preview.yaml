# What the bench (the plugins repository's tools/preview.py) shows: the tile with a house in the afternoon and one in
# the evening, and the card with thirty days. Never put a secret here.
tiles:
  - tile: flow
    name: Sunny afternoon
    options:
      solar: sensor.total_dc_power
      grid: sensor.meter_active_power
      battery: sensor.battery_power
      soc: sensor.battery_level
      house: sensor.load_power
      string1: sensor.mppt1_power
      string2: sensor.mppt2_power
      battery_temp: sensor.battery_temperature
      invert_battery: true
  - tile: flow
    name: Evening on the grid
    options:
      solar: sensor.evening_dc_power
      grid: sensor.evening_meter_power
      battery: sensor.evening_battery_power
      soc: sensor.evening_battery_level
      battery_temp: sensor.battery_temperature
  - tile: flow
    name: No sensors yet
    sizes: [2x2]

states:
  sensor.total_dc_power: { state: "5240", attributes: { unit_of_measurement: W } }
  sensor.meter_active_power: { state: "-1180", attributes: { unit_of_measurement: W } }
  sensor.battery_power: { state: "1520", attributes: { unit_of_measurement: W } }
  sensor.battery_level: { state: "64", attributes: { unit_of_measurement: "%" } }
  sensor.load_power: { state: "2.54", attributes: { unit_of_measurement: kW } }
  sensor.mppt1_power: { state: "2810", attributes: { unit_of_measurement: W } }
  sensor.mppt2_power: { state: "2430", attributes: { unit_of_measurement: W } }
  sensor.battery_temperature: { state: "18.0", attributes: { unit_of_measurement: "°C" } }
  sensor.evening_dc_power: { state: "0", attributes: { unit_of_measurement: W } }
  sensor.evening_meter_power: { state: "2120", attributes: { unit_of_measurement: W } }
  sensor.evening_battery_power: { state: "0", attributes: { unit_of_measurement: W } }
  sensor.evening_battery_level: { state: "3", attributes: { unit_of_measurement: "%" } }

